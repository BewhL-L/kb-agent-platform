name: knowledge-base-platform

# 说明：
#   1. backend/.env 通过 env_file 注入（不要用 volumes 挂 .env：文件不存在时 Docker 会建成目录）
#   2. 所有「运行期会变」的状态统一落在 backend/data/，backend 与 celery-worker 共享同一份
#      （BM25 索引、Embedding 缓存、长期记忆、评测报告）——否则 worker 建的索引 API 看不到
#   3. 真正不可变的数据（业务库、向量、文件）分别放 postgres / qdrant / backend/uploads
#   4. 端口默认只绑 127.0.0.1（仅本机可访问）。需要局域网/手机访问时，把对应行的
#      "127.0.0.1:80:80" 改成 "80:80"，并自行确认网络环境可信。
#   5. 不设 container_name：容器名由 Compose 自动生成为 <项目名>-<服务名>-<序号>，
#      这样才能 --scale 扩容，也才能用不同项目名同时跑 dev/prod 两套。

services:
  # ========== PostgreSQL：业务数据库 ==========
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kb_password
      POSTGRES_DB: knowledge_base
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 停机留出干净 shutdown 的时间：被硬杀会让下次启动走 crash recovery，
    # 在恢复窗口内后端连不上库（日志里表现为 database system is starting up）
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== Redis：缓存 + 消息队列 ==========
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== Qdrant：向量数据库 ==========
  qdrant:
    # 固定小版本：latest 会在某次 pull 后行为漂移，向量数据格式不保证向后兼容
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # HTTP API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    # qdrant 官方镜像内没有 curl/wget，只能用 bash 的 /dev/tcp 探活
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ========== 后端服务（FastAPI） ==========
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # 启动前把库升到 head：空库建全、老库自动 stamp、已纳管则幂等升级
    command: sh -c "python scripts/db_bootstrap.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    environment:
      # 容器内不是开发环境：关闭 DEBUG，避免把堆栈直接回给客户端
      - DEBUG=false
      # 异步模式：以 Compose 为准，不依赖 .env 里的值。
      # 基础版没有 celery-worker，必须是 thread；prod overlay 会覆盖成 celery。
      - ASYNC_MODE=thread
      # 数据库：Docker 网络内用服务名 postgres
      - DATABASE_URL=postgresql+psycopg2://postgres:kb_password@postgres:5432/knowledge_base
      # Redis：Docker 网络内用服务名 redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # 向量数据库：切换为 Qdrant
      - VECTOR_PROVIDER=qdrant
      - QDRANT_URL=http://qdrant:6333
      # 运行期可写状态统一放 /app/data（与 celery-worker 共享）
      - BM25_INDEX_DIR=/app/data/bm25_index
      - EMBEDDING_CACHE_PATH=/app/data/embedding_cache.json
      - LONG_MEMORY_PATH=/app/data/long_memory.json
      - EVAL_REPORT_DIR=/app/data/eval_reports
      - UPLOAD_DIR=/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # db_bootstrap 与 lifespan 内均有约 2 分钟的退避等待，这段时间的不健康不计入
      start_period: 90s
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ========== 前端服务（Nginx 托管 + 反向代理） ==========
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy

# ========== 数据持久化卷 ==========
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
