# Alembic configuration.
#
# NOTE: keep this file ASCII-only. alembic reads it with the OS locale encoding,
# and on zh-CN Windows that is GBK -- non-ASCII comments break startup.
#
# The database URL is NOT set here: migrations/env.py reads app.config.settings
# (env var > backend/.env > code default), so there is only one source of truth.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
