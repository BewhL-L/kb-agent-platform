# ==============================================================================
# 可选：宿主机级 Nginx 配置（本机 Windows/Linux 上再装一个 Nginx 的场合）
# ------------------------------------------------------------------------------
# 什么时候才需要它？
#   - 你要用自己的域名 + HTTPS 证书对外提供服务；
#   - 否则不需要：docker-compose 里的 frontend 容器已内置 Nginx，
#     静态托管和 /api/ 反代都由它完成，直接 http://localhost 即可。
#
# 使用前提（二选一）：
#   A. 前端容器改为映射 8080，把 80/443 让给宿主机 Nginx：
#        docker-compose.yml → frontend.ports: ["127.0.0.1:8080:80"]
#   B. 前端容器仍占 80，则本文件只监听 443（删掉下面 80 端口的 server 块）。
#
# 反面示例（原配置的错误写法，勿模仿）：
#     location / { proxy_pass http://127.0.0.1:80; }   # 监听 80 又反代到 80 = 自己代理自己，必然 500
# ==============================================================================

# 上游指向前端容器映射到宿主机的端口
upstream kb_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP：仅用于跳转 HTTPS / 证书续期验证
server {
    listen 80;
    server_name your-domain.com;

    # certbot webroot 校验（申请/续期证书时放行）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25 推荐写法；若你的 nginx < 1.25，把这两行换成 listen 443 ssl http2;
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 上传大小与后端 MAX_FILE_SIZE_MB 保持一致（默认 15M）
    client_max_body_size 15M;

    # 全部请求交给前端容器：静态资源、/api/、/embed/、/a2a/、/uploads/ 都由容器内 Nginx 再分发
    location / {
        proxy_pass http://kb_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE 流式问答：宿主机这一层同样不能缓冲，否则前端会「一次性吐出」
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# WebSocket / SSE 所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
